name: Saved board compatibility

# Loads boards saved by earlier versions into the pull request's code and fails
# if any pins, groups or preferences would be lost or changed.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: state-compat-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  state-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Playwright
        working-directory: head/tests
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Check saved boards still load
        working-directory: head/tests
        run: bun state-compat.mjs --head .. --base ../../base
