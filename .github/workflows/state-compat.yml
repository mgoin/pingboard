name: Saved board compatibility

# Loads boards saved by earlier versions into the pull request's code and fails
# if any pins, groups or preferences would be lost or changed.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: state-compat-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  state-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: head/tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Check saved boards still load
        working-directory: head/tests
        run: node state-compat.mjs --head .. --base ../../base
